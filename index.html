<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ARISE — Solo Leveling System</title>
<style>
  :root {
    --bg: #070d16;
    --card: #0c1a2b;
    --system: #38bdf8;
    --system-glow: #7dd3fc;
    --muted: #93a4bd;
    --fg: #eef4fb;
    --amber: #fcd34d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: "JetBrains Mono", ui-monospace, "Courier New", monospace;
    min-height: 100%;
  }
  body {
    background-image:
      linear-gradient(rgba(56,189,248,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56,189,248,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  button { font-family: inherit; cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px 96px; }

  /* ---- System window ---- */
  .win {
    position: relative;
    background: linear-gradient(145deg, rgba(12,26,43,0.92), rgba(8,18,32,0.85));
    border: 1px solid rgba(56,189,248,0.35);
    box-shadow: 0 0 25px rgba(56,189,248,0.10), inset 0 0 30px rgba(56,189,248,0.04);
    padding: 18px;
    margin-bottom: 18px;
    animation: winin .4s ease-out both;
  }
  .win::before, .win::after {
    content: ""; position: absolute; width: 12px; height: 12px;
    border-color: rgba(125,211,252,0.85); pointer-events: none;
  }
  .win::before { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }
  .win::after { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; }
  @keyframes winin { from {opacity:0; transform: translateY(8px);} to {opacity:1; transform:none;} }

  .win-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .win-title { font-size: 13px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
    color: var(--system); text-shadow: 0 0 8px rgba(56,189,248,.6); }
  .win-tag { font-size: 10px; letter-spacing: .15em; color: rgba(56,189,248,.6); text-transform: uppercase; }
  .divider { height:1px; background: linear-gradient(90deg, transparent, rgba(56,189,248,.6), transparent); margin-bottom:16px; }

  .glow { text-shadow: 0 0 8px rgba(56,189,248,.7), 0 0 18px rgba(56,189,248,.35); }
  .muted { color: var(--muted); }
  .system { color: var(--system); }
  .amber { color: var(--amber); }
  .small { font-size: 11px; }
  .tiny { font-size: 10px; }

  /* ---- quest / toggle item ---- */
  .item {
    display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left;
    border:1px solid rgba(56,189,248,.15); background: rgba(0,0,0,.2);
    padding:10px 12px; transition: all .15s; color: inherit;
  }
  .item:hover { border-color: rgba(56,189,248,.4); }
  .item.done { border-color: rgba(56,189,248,.4); background: rgba(56,189,248,.1); }
  .check {
    flex:none; width:20px; height:20px; border:1px solid rgba(56,189,248,.4);
    display:flex; align-items:center; justify-content:center; margin-top:2px;
    color: transparent; font-weight: 900; font-size: 13px;
  }
  .item.done .check { background: var(--system); border-color: var(--system); color: #04121f; }
  .item-title { font-size: 14px; font-weight: 500; }
  .item.done .item-title { color: rgba(56,189,248,.7); text-decoration: line-through; }
  .item-sub { font-size: 11px; color: var(--muted); margin-top: 2px; line-height:1.45; }
  .item-meta { flex:none; text-align:right; }

  /* ---- grids ---- */
  .grid2 { display:grid; gap:12px; grid-template-columns: 1fr; }
  .grid3 { display:grid; gap:10px; grid-template-columns: 1fr 1fr 1fr; }
  .grid6 { display:grid; gap:10px; grid-template-columns: repeat(3,1fr); }
  @media (min-width: 720px) {
    .grid2 { grid-template-columns: 1fr 1fr; }
    .grid6 { grid-template-columns: repeat(6,1fr); }
  }

  .stat-box { border:1px solid rgba(56,189,248,.15); background: rgba(0,0,0,.2); padding:12px; text-align:center; }

  .bar { height:8px; width:100%; background: rgba(0,0,0,.5); overflow:hidden; position:relative; }
  .bar > i { display:block; height:100%; background: linear-gradient(90deg, rgba(56,189,248,.7), var(--system));
    box-shadow: 0 0 10px rgba(56,189,248,.6); transition: width .5s; }
  .barthin { height:4px; }

  .btn {
    border:1px solid var(--system); background: rgba(56,189,248,.1); color: var(--system);
    padding: 12px 18px; font-size: 13px; letter-spacing: .15em; text-transform: uppercase; font-weight:700;
    transition: all .15s; text-align:center;
  }
  .btn:hover { background: rgba(56,189,248,.2); }
  .btn:disabled { opacity:.4; cursor: not-allowed; }
  .btn-ghost { background: transparent; border-color: rgba(255,255,255,.6); color: #fff; }
  .btn-ghost:hover { background:#fff; color:#000; }

  .chip { border:1px solid rgba(56,189,248,.3); padding: 2px 8px; font-size:10px; color: rgba(56,189,248,.85); }

  input.txt {
    width:100%; border:1px solid rgba(56,189,248,.3); background: rgba(0,0,0,.4); color: var(--fg);
    padding:12px 14px; outline:none; font-family:inherit; font-size:14px;
  }
  input.txt:focus { border-color: var(--system); }

  /* ---- nav ---- */
  .topnav { position: sticky; top:0; z-index:40; background: rgba(7,13,22,.9); backdrop-filter: blur(8px);
    border-bottom:1px solid rgba(56,189,248,.2); }
  .topnav .row { max-width:980px; margin:0 auto; display:flex; align-items:center; gap:6px; padding:10px 12px; flex-wrap:wrap; }
  .navbtn { border:1px solid transparent; padding:8px 12px; font-size:13px; color: var(--muted); background:transparent; }
  .navbtn:hover { color: var(--fg); }
  .navbtn.active { border-color: rgba(56,189,248,.4); background: rgba(56,189,248,.1); color: var(--system); text-shadow:0 0 8px rgba(56,189,248,.6); }
  .logo { font-weight:800; font-style:italic; letter-spacing:.18em; color: var(--system); transform: skewX(-10deg);
    text-shadow:0 0 8px rgba(56,189,248,.6); font-size:20px; margin-right: auto; }

  /* ---- landing ---- */
  .landing { position: relative; min-height: 100vh; overflow:hidden; background:#000; }
  .stars {
    position:absolute; inset:0; opacity:.3;
    background-image:
      radial-gradient(1px 1px at 20% 30%, #fff, transparent),
      radial-gradient(1px 1px at 60% 70%, #fff, transparent),
      radial-gradient(1px 1px at 50% 50%, #fff, transparent),
      radial-gradient(1px 1px at 80% 10%, #fff, transparent),
      radial-gradient(1px 1px at 90% 60%, #fff, transparent),
      radial-gradient(1px 1px at 33% 80%, #fff, transparent),
      radial-gradient(1px 1px at 15% 60%, #fff, transparent),
      radial-gradient(1px 1px at 70% 40%, #fff, transparent);
    background-size: 200% 200%,180% 180%,250% 250%,220% 220%,190% 190%,240% 240%,210% 210%,230% 230%;
  }
  .landing .inner { position:relative; z-index:10; min-height:100vh; display:flex; align-items:center;
    justify-content:flex-end; padding: 80px 24px; }
  .landing .box { max-width: 520px; }
  .hline { display:flex; align-items:center; gap:8px; opacity:.6; margin-bottom:12px; }
  .hline .l { height:1px; background:#fff; }
  .h1 { font-size: clamp(28px, 6vw, 52px); font-weight:800; letter-spacing:.08em; margin-bottom:16px; }
  .lead { font-size: 15px; color:#cbd5e1; line-height:1.7; margin-bottom:24px; opacity:.85; }
  .landing-actions { display:flex; gap:12px; flex-wrap:wrap; }
  .corner { position:absolute; width:40px; height:40px; z-index:20; }

  .row-between { display:flex; align-items:center; justify-content:space-between; }
  .gap { display:flex; gap:10px; align-items:center; }
  .mt { margin-top:14px; } .mb { margin-bottom:10px; }
  .hidden { display:none !important; }
  ul.clean { list-style:none; } ul.clean li { margin-bottom:6px; }
</style>
</head>
<body>

<script>
"use strict";
// ======================================================================

var STORAGE_KEY = "arise-system-v1";

// ---------- DATA ----------
var DAY_A = {

};
var DAY_B = {
  id:"B", title:"ДЕНЬ B — ЖИМ + НОГИ", subtitle:"Грудь · Трицепс · Плечи · Квадрицепсы",
  target:"Прорисованная грудь «Fight Club» и атлетичные ноги.",
  focusGroups:["chest","arms","shoulders","legs"],
  exercises:[
    { id:"b1", name:"Отжимания на брусьях", sets:4, reps:"6–7", groups:["chest","arms"],
      note:"Опускайся до угла 90° в локтях.",
      july:"+1 повтор в каждый подход (4×8).", aug:"Последний подход — до отказа." },
    { id:"b2", name:"Отжимания с ногами на возвышенности", sets:3, reps:"12–15", groups:["chest","shoulders"],
      note:"Нагрузка на верх груди и передние дельты.",
      july:"Отдых до 60–90 сек.", aug:"Взрывной стиль — отрыв ладоней." },
    { id:"b3", name:"Алмазные отжимания", sets:3, reps:"10–12", groups:["arms","chest"],
      note:"Руки близко. Акцент на трицепс и центр груди.",
      july:"Сократи отдых, негатив 2 сек.", aug:"Взрывной стиль — отрыв ладоней." },
    { id:"b4", name:"Приседания с выпрыгиванием", sets:4, reps:"15", groups:["legs"],
      note:"Взрывная сила ног. Мягкое приземление.",
      july:"+2 повтора (4×17).", aug:"Последний подход — максимум за 40 сек." },
    { id:"b5", name:"Выпады", sets:3, reps:"12 на ногу", groups:["legs"],
      note:"Спина прямая, колено не валится внутрь.",
      july:"Отдых до 60–90 сек.", aug:"Болгарские выпады, если готов." }
  ]
};
var WORKOUT_DAYS = [DAY_A, DAY_B];
var SCHEDULE = [
  { day:"Понедельник", label:"День A — Тяга", workout:"A" },
  { day:"Вторник", label:"День B — Жим + Ноги", workout:"B" },
  { day:"Среда", label:"Отдых", workout:"rest" },
  { day:"Четверг", label:"День A — Тяга", workout:"A" },
  { day:"Пятница", label:"День B — Жим + Ноги", workout:"B" },
  { day:"Суббота", label:"Восстановление", workout:"rest" },
  { day:"Воскресенье", label:"Восстановление", workout:"rest" }
];
var WARMUP = "Перед тренировкой — разминка 5–7 мин (суставная, лёгкие махи). Отдых между подходами 1,5–2 мин. Темп: 2 сек вниз, 1 сек вверх, фиксация вверху.";
var PHASES = {
  june:{ label:"ИЮНЬ — ОБЪЁМ", tag:"Фаза 1", goal:"Идеально чистая техника.",
    rules:["Придерживайся указанных подходов и повторов.","Без рывков: 2 сек вниз, 1 сек вверх.","Фиксация вверху, плавный негатив."] },
  july:{ label:"ИЮЛЬ — ИНТЕНСИВНОСТЬ", tag:"Фаза 2", goal:"Добавляем объём, сокращаем отдых.",
    rules:["+1 повтор в каждый подход на турнике и брусьях.","В отжиманиях отдых 60–90 сек.","Держи технику, не гонись за читингом."] },
  august:{ label:"АВГУСТ — ПИК", tag:"Фаза 3", goal:"Максимум и взрывная сила.",
    rules:["Последний подход подтягиваний и брусьев — до отказа.","В отжиманиях взрывной стиль (отрыв ладоней).","Контроль питания: жир 10–12%."] }
};
var MEALS = [
  { id:"m1", time:"07:30", title:"Завтрак", goal:"Запуск метаболизма: медленные углеводы + белок", items:["Овсянка на воде/молоке","2–3 яйца","Ягоды или банан"] },
  { id:"m2", time:"11:00", title:"Перекус", goal:"Поддержать белок между приёмами", items:["Творог 5%","Горсть орехов","Яблоко"] },
  { id:"m3", time:"14:00", title:"Обед", goal:"Главный приём: белок + сложные углеводы + овощи", items:["Куриное филе / рыба","Гречка или бурый рис","Овощной салат"] },
  { id:"m4", time:"17:00", title:"Предтрен", goal:"Энергия на тренировку (за 1–1,5 ч до)", items:["Банан","Тост с арахисовой пастой","Зелёный чай / кофе"] },
  { id:"m5", time:"20:00", title:"Ужин", goal:"Восстановление: белок + овощи", items:["Омлет / рыба / индейка","Тушёные овощи","Кефир перед сном"] }
];
var RECIPES = [
  { id:"r1", title:"Боевая овсянка чемпиона", kcal:420, protein:28, tags:["завтрак","энергия"],
    ingredients:["60 г овсяных хлопьев","200 мл молока/воды","1 ложка протеина или 2 белка","Ягоды, 1 ч.л. мёда"],
    steps:["Свари овсянку 5 минут.","Вмешай протеин (или белки отдельно).","Добавь ягоды и мёд."] },
  { id:"r2", title:"Куриное филе + гречка", kcal:540, protein:52, tags:["обед","набор"],
    ingredients:["200 г куриного филе","80 г гречки (сухой вес)","Специи, немного масла","Свежие овощи"],
    steps:["Отвари гречку (1:2, 15 мин).","Обжарь филе по 4–5 мин с каждой стороны.","Подавай с салатом."] },
  { id:"r3", title:"Омлет «Сушка»", kcal:300, protein:30, tags:["ужин","белок"],
    ingredients:["3 яйца (или 1 целое + 3 белка)","Шпинат / помидоры / перец","Соль, перец"],
    steps:["Взбей яйца, добавь овощи.","Готовь под крышкой 4–5 минут.","Минимум масла — для рельефа."] },
  { id:"r4", title:"Творожный крем перед сном", kcal:220, protein:32, tags:["перед сном","восстановление"],
    ingredients:["200 г творога 5%","Корица","Половина банана"],
    steps:["Взбей творог блендером.","Добавь корицу и банан.","Казеин работает всю ночь."] }
];
var HABITS = [
  { id:"h1", title:"Подъём в 06:30", desc:"Ранний подъём задаёт ритм дня.", icon:"🌅", stat:"PER", xp:15 },
  { id:"h2", title:"Чтение 20 минут", desc:"Книга вместо ленты.", icon:"📖", stat:"INT", xp:15 },
  { id:"h3", title:"Вода 2–2,5 л", desc:"8–10 стаканов за день.", icon:"💧", stat:"VIT", xp:10 },
  { id:"h4", title:"Без сахара и фастфуда", desc:"Никакого пищевого мусора.", icon:"🚫", stat:"VIT", xp:20 },
  { id:"h5", title:"Сон до 23:00", desc:"7–8 часов — главный анаболик.", icon:"🌙", stat:"VIT", xp:15 },
  { id:"h6", title:"10 минут растяжки", desc:"Мобильность, профилактика травм.", icon:"🤸", stat:"AGI", xp:10 },
  { id:"h7", title:"Холодный душ", desc:"Дисциплина и бодрость.", icon:"❄️", stat:"PER", xp:10 }
];
var STATS = [
  { key:"STR", ru:"Сила" }, { key:"VIT", ru:"Выносл." }, { key:"AGI", ru:"Ловкость" },
  { key:"INT", ru:"Интеллект" }, { key:"PER", ru:"Дисциплина" }, { key:"SENSE", ru:"Фокус" }
];
var MUSCLE_LABELS = { back:"Спина", chest:"Грудь", shoulders:"Плечи", arms:"Руки", legs:"Ноги", core:"Пресс" };
var LEVEL_LABELS = { novice:"Новичок", intermediate:"Средний", advanced:"Продвинутый" };
var GROUPS = ["back","chest","shoulders","arms","legs","core"];
var FITNESS_TESTS = [
  { key:"pullups", title:"Подтягивания прямым хватом", hint:{novice:"0–3 раза",intermediate:"4–8 раз",advanced:"9+ раз"} },
  { key:"dips", title:"Отжимания на брусьях", hint:{novice:"0–4 раза",intermediate:"5–10 раз",advanced:"11+ раз"} },
  { key:"pushups", title:"Отжимания от пола", hint:{novice:"0–15 раз",intermediate:"16–30 раз",advanced:"31+ раз"} },
  { key:"squats", title:"Приседания", hint:{novice:"0–20 раз",intermediate:"21–40 раз",advanced:"41+ раз"} },
  { key:"core", title:"Подъём коленей на турнике", hint:{novice:"0–8 раз",intermediate:"9–15 раз",advanced:"16+ раз"} }
];
var LEVELS = ["novice","intermediate","advanced"];
var RANK_THRESHOLDS = [ {r:"E",l:1},{r:"D",l:5},{r:"C",l:10},{r:"B",l:18},{r:"A",l:28},{r:"S",l:40} ];

// ---------- HELPERS ----------
function todayKey(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function currentPhase(){ var m=new Date().getMonth(); if(m===6)return"july"; if(m===7)return"august"; return"june"; }
function xpForLevel(l){ return 100 + (l-1)*40; }
function rankForLevel(l){ var r="E"; for(var i=0;i<RANK_THRESHOLDS.length;i++){ if(l>=RANK_THRESHOLDS[i].l) r=RANK_THRESHOLDS[i].r; } return r; }
function exForPhase(ex,p){ if(p==="july"&&ex.july)return ex.july; if(p==="august"&&ex.aug)return ex.aug; return ex.note||""; }
function scheduleToday(){ var j=new Date().getDay(); return SCHEDULE[(j+6)%7]; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function groupStat(g){ return (g==="legs"||g==="core") ? "AGI" : "STR"; }

var HABIT_MAP={}, EX_MAP={};
HABITS.forEach(function(h){ HABIT_MAP[h.id]=h; });
WORKOUT_DAYS.forEach(function(d){ d.exercises.forEach(function(e){ EX_MAP[e.id]=e; }); });

var XP = { exercise:12, meal:8, water:3, maxWater:10 };
function logXp(l){
  var xp = l.exercisesDone.length*XP.exercise + l.mealsDone.length*XP.meal + Math.min(l.water,XP.maxWater)*XP.water;
  l.habitsDone.forEach(function(id){ xp += (HABIT_MAP[id]?HABIT_MAP[id].xp:0); });
  return xp;
}

// ---------- STATE ----------
function defaultProfile(){
  return { name:"ОХОТНИК", phase:currentPhase(), selectedGroups:GROUPS.slice(),
    fitness:{pullups:null,dips:null,pushups:null,squats:null,core:null}, onboarded:false };
}
function defaultState(){ return { profile:defaultProfile(), logs:{} }; }
var state = load();
function load(){
  try { var raw = localStorage.getItem(STORAGE_KEY); if(raw){ var p=JSON.parse(raw);
    p.profile = Object.assign(defaultProfile(), p.profile||{}); p.logs = p.logs||{}; return p; } } catch(e){}
  return defaultState();
}
function save(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){} }
function emptyLog(k){ return { date:k, exercisesDone:[], habitsDone:[], mealsDone:[], water:0, workoutDay:null }; }
function todayLog(){ var k=todayKey(); if(!state.logs[k]) state.logs[k]=emptyLog(k); return state.logs[k]; }
function toggleArr(a,id){ var i=a.indexOf(id); if(i>=0)a.splice(i,1); else a.push(id); }

function derive(){
  var stats={STR:10,VIT:10,AGI:10,INT:10,PER:10,SENSE:10};
  var totalXp=0, keys=Object.keys(state.logs);
  keys.forEach(function(k){
    var log=state.logs[k]; totalXp += logXp(log);
    log.exercisesDone.forEach(function(id){ var ex=EX_MAP[id]; if(ex){ ex.groups.forEach(function(g){ stats[groupStat(g)]+=1; }); stats.SENSE+=1; } });
    log.habitsDone.forEach(function(id){ var h=HABIT_MAP[id]; if(h) stats[h.stat]+=2; });
    stats.VIT += log.mealsDone.length;
    if(Math.min(log.water,XP.maxWater)>=8) stats.VIT+=1;
  });
  var level=1, rem=totalXp;
  while(rem>=xpForLevel(level)){ rem-=xpForLevel(level); level++; }
  // streak
  var streak=0, d=new Date();
  for(var i=0;i<400;i++){
    var lg=state.logs[todayKey(d)];
    var active = lg && (lg.exercisesDone.length||lg.habitsDone.length||lg.mealsDone.length||lg.water>0);
    if(active) streak++; else if(i!==0) break;
    d.setDate(d.getDate()-1);
  }
  return { totalXp:totalXp, level:level, xpInto:rem, xpToNext:xpForLevel(level), rank:rankForLevel(level), stats:stats, streak:streak };
}

  var el = e.target.closest("[data-action]"); if(!el) return;
  var a = el.getAttribute("data-action");
  if(a==="goto"){
    var v=el.getAttribute("data-view");
    if(v==="app" || v==="onboarding" || v==="landing"){ view=v; tab="status"; render(); window.scrollTo(0,0); }
    return;
  }
  if(a==="set-tab"){ tab=el.getAttribute("data-tab"); render(); window.scrollTo(0,0); return; }
  if(a==="toggle-exercise"){ toggleArr(todayLog().exercisesDone, el.getAttribute("data-id")); save(); render(); return; }
  if(a==="toggle-habit"){ toggleArr(todayLog().habitsDone, el.getAttribute("data-id")); save(); render(); return; }
  if(a==="toggle-meal"){ toggleArr(todayLog().mealsDone, el.getAttribute("data-id")); save(); render(); return; }
  if(a==="water"){ var lg=todayLog(); lg.water=Math.max(0,Math.min(12, lg.water + parseInt(el.getAttribute("data-delta"),10))); save(); render(); return; }
  if(a==="set-phase"){ state.profile.phase=el.getAttribute("data-phase"); save(); render(); return; }
  if(a==="open-day"){ openDay=el.getAttribute("data-day"); render(); return; }
  if(a==="set-fitness"){ state.profile.fitness[el.getAttribute("data-key")]=el.getAttribute("data-level"); save(); render(); return; }
  if(a==="toggle-group"){ var g=el.getAttribute("data-group"); var arr=state.profile.selectedGroups; var idx=arr.indexOf(g); if(idx>=0)arr.splice(idx,1); else arr.push(g); save(); render(); return; }
  if(a==="finish-onboarding"){
    var input=document.getElementById("name-input"); var nm = input? input.value.trim() : "";
    if(nm) state.profile.name=nm;
    if(!state.profile.selectedGroups.length) state.profile.selectedGroups=GROUPS.slice();
    state.profile.onboarded=true; save(); view="app"; tab="status"; render(); window.scrollTo(0,0); return;
  }
});

// keep name input value while typing without re-render
document.addEventListener("input", function(e){
  if(e.target && e.target.id==="name-input"){ state.profile.name=e.target.value.trim()||"ОХОТНИК"; }
});

render();
</script>
</body>
</html>
